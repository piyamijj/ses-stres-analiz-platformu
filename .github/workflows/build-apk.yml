# Ses Stres Analiz Platformu - Android APK Derleme İş Akışı
#
# Bu iş akışı, piyamijj/Translater deposundaki çalışan ve doğrulanmış CI/CD
# hattından uyarlanmıştır. Next.js statik çıktısını (out/) Capacitor ile
# Android projesine gömer ve otomatik olarak APK derler.

name: Ses Stres Analiz Platformu - Android APK Derleme

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build static web bundle (Capacitor target)
        run: npm run build:capacitor

      - name: Generate native Android project if missing
        id: gen_android
        run: |
          if [ ! -d "android/app" ]; then
            if [ -d "android" ]; then
              echo "Removing incomplete android/ directory before generating"
              rm -rf android
            fi
            echo "generating native project via Capacitor CLI"
            npx cap add android
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "android/app already present — skipping generation"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated android/ project back to the repo
        if: steps.gen_android.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "chore: generate Capacitor Android native project [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Sync web build into native project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode release keystore (optional)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      # TEMPORARY DIAGNOSTIC STEP — remove once the "Failed to read key ... from store" signing
      # failure is root-caused. openssl gives a concrete PKCS12 error (unlike Gradle's opaque
      # wrapper), and printing both JDK versions lets us compare against whatever generated the
      # keystore locally (PKCS12 PBE/MAC algorithm defaults changed across JDK versions).
      - name: DEBUG - diagnose keystore readability
        if: steps.keystore.outputs.has_keystore == 'true'
        continue-on-error: true
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "--- java -version (runner default) ---"
          java -version
          echo "--- JDK used by Gradle (android/gradlew -version) ---"
          (cd android && ./gradlew -version) || true
          echo "--- openssl pkcs12 -info on the decoded keystore ---"
          openssl pkcs12 -info -in android/app/release.keystore -passin "pass:$RELEASE_KEYSTORE_PASSWORD" -noout
          echo "openssl exit code: $?"

      - name: Build signed release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"

      - name: Build debug APK (no signing secrets configured)
        if: steps.keystore.outputs.has_keystore != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Locate built APK
        id: apk
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=SesStresAnalizPlatformu-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=SesStresAnalizPlatformu-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare friendly-named APK copy
        id: apk_named
        run: |
          mkdir -p dist
          cp "${{ steps.apk.outputs.path }}" "dist/${{ steps.apk.outputs.name }}"
          echo "path=dist/${{ steps.apk.outputs.name }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ses-stres-analiz-platformu-apk
          path: ${{ steps.apk_named.outputs.path }}
          retention-days: 30

      - name: Determine release version
        id: version
        run: |
          git fetch --tags --force
          latest_tag=$(git tag --list 'v*.*.*' | sort -V | tail -n1)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # This run was triggered by a tag push itself — reuse that tag, do not bump again
            next_tag="${GITHUB_REF#refs/tags/}"
          elif [ -z "$latest_tag" ]; then
            next_tag="v1.0.0"
          else
            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push new release tag (branch pushes only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Ses Stres Analiz Platformu ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Publish GitHub Release with APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ses Stres Analiz Platformu ${{ steps.version.outputs.tag }}
          files: ${{ steps.apk_named.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
