apply plugin: 'com.android.application'

android {
    namespace "com.stressvoice.sesstresanaliz"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.stressvoice.sesstresanaliz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Release signing is intentionally OPT-IN, never a hardcoded value or a committed
    // keystore. .github/workflows/build-apk.yml already passes
    // -Pandroid.injected.signing.store.file/.store.password/.key.alias/.key.password when the
    // RELEASE_KEYSTORE_* repo secrets are configured, and falls back to assembleDebug when
    // they're not — this block just gives AGP a signingConfig to actually attach those
    // injected properties to.
    //
    // NOTE (root cause of the "release APK isn't really signed" gap): those
    // "-Pandroid.injected.signing.*" CLI properties were already being passed by CI, but had
    // no effect, because AGP only consults them for a signingConfig that is attached to the
    // build type — there was no signingConfigs block in this file at all. So even with the
    // secrets populated, `assembleRelease` would still emit an unsigned
    // app-release-unsigned.apk (not installable on a real device), not a signed
    // app-release.apk.
    def gnInjStoreFile = project.findProperty('android.injected.signing.store.file')
    if (gnInjStoreFile) {
        signingConfigs {
            release {
                storeFile file(gnInjStoreFile)
                storePassword project.findProperty('android.injected.signing.store.password')
                keyAlias project.findProperty('android.injected.signing.key.alias')
                keyPassword project.findProperty('android.injected.signing.key.password')
                // This project's keystore is generated with OpenSSL as PKCS12 (not keytool /
                // legacy JKS) — must be declared explicitly or AGP assumes JKS and fails to
                // load it.
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            if (gnInjStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
